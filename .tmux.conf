# General Settings ###
set -g default-terminal "tmux-256color"
set-option -g allow-rename off
set -g mouse on
set -g history-limit 5000          # More scrollback history
set-option -g default-shell $SHELL  # Use your default shell
set -g base-index 1                 # Windows start at 1
setw -g pane-base-index 1           # Panes start at 1
set -sg escape-time 10              # Give tmux 10ms to parse multi-byte escape sequences
set -g allow-passthrough on         # Allow escape sequence passthrough (DEC 2026 sync, OSC52, etc.)
setw -g aggressive-resize off       # Prevent resize redraw artifacts
set -g popup-style default
# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
setw -g clock-mode-colour yellow
# copy mode
setw -g mode-style 'fg=black bg=red bold'
# messages
set -g message-style 'fg=yellow bg=red bold'

# Terminal features & Cursor Rendering
# Disable synchronized output only for terminals affected by cursor flicker.
set -as terminal-features ',xterm-kitty*:RGB:usstyle:sync@'
set -as terminal-features ',xterm-ghostty*:RGB:usstyle:sync@'
set -as terminal-overrides ',xterm-kitty*:cnorm=\E[?12l\E[?25h:cvvis=\E[?12l\E[?25h'
set -as terminal-overrides ',xterm-ghostty*:cnorm=\E[?12l\E[?25h:cvvis=\E[?12l\E[?25h'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q' # Fallback for DECSCUSR cursor shape sequences

### Status Bar ###
set -g status-bg black
set -g status-fg white
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 220
set -g status-left "#[fg=green]#S #[fg=colour240]│ "
setw -g window-status-style "fg=colour245,bg=black"
setw -g window-status-current-style "fg=black,bg=cyan,bold"
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-separator ""
# Plan usage (5h session / 7d weekly): Claude from ~/.claude/tmux-usage.sh,
# Codex from ~/.local/bin/tmux-codex-usage (dotfiles/scripts/tmux-codex-usage),
# Agy from ~/.local/bin/tmux-agy-usage (dotfiles/scripts/tmux-agy-usage)
set -g status-right "#(~/.claude/tmux-usage.sh)  #(~/.local/bin/tmux-codex-usage)  #(~/.local/bin/tmux-agy-usage)  #[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M"

setw -g window-status-bell-style 'fg=yellow bg=red bold'

### Keybindings ###
unbind C-b
set -g prefix C-a                   # Use Ctrl+a instead of Ctrl+b
bind C-a send-prefix

#### Hard-core keybindings for panes and windows ####


# Unset/unbind default arrow key navigation
unbind Up
unbind Down
unbind Left
unbind Right


bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
bind | split-window -h
bind - split-window -v

# Map HJKL for pane selection with prefix (fallback) and Alt+hjkl without prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

### Vi-mode ###
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection

### Workflow popups (prefix + key) ###
# lazygit in popup at current pane path
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# lazydocker in popup at current pane path
bind -r D display-popup -d '#{pane_current_path}' -w80% -h80% -E lazydocker

# Fuzzy project/session switching popup
bind -r f display-popup -w80% -h80% -E "~/Documents/Dev/kien.mac/dotfiles/scripts/tmux-sessionizer"

# Kitty theme picker: fzf list of kitty-themes, writes theme.conf include
bind -r T display-popup -w80% -h80% -E "~/Documents/Dev/kien.mac/dotfiles/scripts/kitty-theme-switcher"


# Agent Switcher: Choose between Agy, Cursor, and Codex agents
bind -r u display-menu -T "Choose Agent CLI" -x C -y C \
  "Cursor"  a { run-shell 'case "#{session_name}" in agents-*) tmux split-window -h -c "#{pane_current_path}" "$HOME/.local/bin/cursor-agent"; tmux select-layout tiled;; *) target="agents-#{session_name}"; if tmux has-session -t "$target" 2>/dev/null; then tmux split-window -h -t "$target" -c "#{pane_current_path}" "$HOME/.local/bin/cursor-agent"; tmux select-layout -t "$target" tiled; else tmux new-session -d -s "$target" -n "active" -c "#{pane_current_path}" "$HOME/.local/bin/cursor-agent"; fi; tmux display-popup -w80% -h80% -E "tmux attach-session -t $target";; esac' } \
  "Agy"     g { run-shell 'case "#{session_name}" in agents-*) tmux split-window -h -c "#{pane_current_path}" "$HOME/.local/bin/agy --dangerously-skip-permissions"; tmux select-layout tiled;; *) target="agents-#{session_name}"; if tmux has-session -t "$target" 2>/dev/null; then tmux split-window -h -t "$target" -c "#{pane_current_path}" "$HOME/.local/bin/agy --dangerously-skip-permissions"; tmux select-layout -t "$target" tiled; else tmux new-session -d -s "$target" -n "active" -c "#{pane_current_path}" "$HOME/.local/bin/agy --dangerously-skip-permissions"; fi; tmux display-popup -w80% -h80% -E "tmux attach-session -t $target";; esac' } \
  "Claude"     c { run-shell 'case "#{session_name}" in agents-*) tmux split-window -h -c "#{pane_current_path}" "$HOME/.local/bin/claude --dangerously-skip-permissions"; tmux select-layout tiled;; *) target="agents-#{session_name}"; if tmux has-session -t "$target" 2>/dev/null; then tmux split-window -h -t "$target" -c "#{pane_current_path}" "$HOME/.local/bin/claude --dangerously-skip-permissions"; tmux select-layout -t "$target" tiled; else tmux new-session -d -s "$target" -n "active" -c "#{pane_current_path}" "$HOME/.local/bin/claude --dangerously-skip-permissions"; fi; tmux display-popup -w80% -h80% -E "tmux attach-session -t $target";; esac' } \
  "Codex"   x { run-shell 'case "#{session_name}" in agents-*) tmux split-window -h -c "#{pane_current_path}" "$HOME/.local/share/mise/installs/node/latest/bin/codex"; tmux select-layout tiled;; *) target="agents-#{session_name}"; if tmux has-session -t "$target" 2>/dev/null; then tmux split-window -h -t "$target" -c "#{pane_current_path}" "$HOME/.local/share/mise/installs/node/latest/bin/codex"; tmux select-layout -t "$target" tiled; else tmux new-session -d -s "$target" -n "active" -c "#{pane_current_path}" "$HOME/.local/share/mise/installs/node/latest/bin/codex"; fi; tmux display-popup -w80% -h80% -E "tmux attach-session -t $target";; esac' } \
  "Pi"   p { run-shell 'case "#{session_name}" in agents-*) tmux split-window -h -c "#{pane_current_path}" "$HOME/.local/bin/pi "; tmux select-layout tiled;; *) target="agents-#{session_name}"; if tmux has-session -t "$target" 2>/dev/null; then tmux split-window -h -t "$target" -c "#{pane_current_path}" "$HOME/.local/bin/pi "; tmux select-layout -t "$target" tiled; else tmux new-session -d -s "$target" -n "active" -c "#{pane_current_path}" "$HOME/.local/bin/pi "; fi; tmux display-popup -w80% -h80% -E "tmux attach-session -t $target";; esac' }

# Open/toggle agent session of current session
bind -r a run-shell 'case "#{session_name}" in agents-*) tmux display-message "Already in agent session";; *) target="agents-#{session_name}"; if ! tmux has-session -t "$target" 2>/dev/null; then tmux new-session -d -s "$target" -n "active" -c "#{pane_current_path}" "$HOME/.local/bin/cursor-agent"; fi; tmux display-popup -w80% -h80% -E "tmux attach-session -t $target";; esac'


### TPM Plugin System ###
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'schasse/tmux-jump'
# Keep prefix+w as choose-window; plugin default switch key is w
set -g @worktree_switch_key 't'

# extrakto default is tab; set explicitly so a stale @extrakto_key cannot linger
set -g @extrakto_key 'tab'

# tmux-jump defaults to j; keep hjkl for panes
set -g @jump-key 'e'

# Resurrect & Continuum configurations
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Init TPM
run '~/.tmux/plugins/tpm/tpm'
run '~/.tmux/plugins/tmux-worktree/worktree.tmux'

# Post-TPM overrides (prevent plugins from enabling aggressive-resize or altering escape-time)
setw -g aggressive-resize off
set -sg escape-time 10
bind w choose-window
