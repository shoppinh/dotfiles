include ./kitty-themes/themes/Dracula.conf
# Window borders (Dracula palette)
active_border_color     #f0fa8b
inactive_border_color   #54555a
bell_border_color       #ff5555
# Tab bar (Dracula palette)
active_tab_foreground   #1e1f28
active_tab_background   #f0fa8b
inactive_tab_foreground #969697
inactive_tab_background #1e1f28
tab_bar_edge                bottom
tab_title_template "{title.split('/')[-1][:15]}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"
